<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 | 찾아줘</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin-login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">찾아줘 관리자</p>
    <h1>관리자 로그인</h1>
    <p>관리자 비밀번호를 입력하면 전체 분실물 관리 화면으로 이동합니다.</p>
    <form id="login-form" class="auth-form">
      <label class="sr-only" for="password">관리자 비밀번호</label>
      <input id="password" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" required>
      <button class="button button-primary" type="submit">로그인</button>
    </form>
    <p id="login-message" class="notice" role="status" aria-live="polite"></p>
    <a class="back-link" href="/">← 일반 화면으로 돌아가기</a>
  </main>
</body>
</html>
